<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Download File</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
  .card{background:#fff;border-radius:16px;box-shadow:0 6px 28px rgba(0,0,0,.1);max-width:440px;width:100%;padding:22px;text-align:center}
  .preview{background:#f9fafb;border-radius:12px;overflow:hidden;margin-bottom:16px;display:flex;align-items:center;justify-content:center;min-height:140px}
  .preview img{max-width:100%;max-height:60vh;display:block}
  .icon{font-size:64px;padding:26px}
  h1{font-size:17px;word-break:break-word;margin-bottom:4px}
  p{font-size:13px;color:#6b7280;margin-bottom:18px}
  a.btn{display:block;background:#16a34a;color:#fff;text-decoration:none;font-weight:600;font-size:16px;padding:14px;border-radius:12px}
  a.btn:active{background:#15803d}
  .err{color:#b91c1c;font-size:15px;padding:20px 0}
</style>
</head>
<body>
<div class="card" id="card"><p>Loading…</p></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCVDNT-v6Zi_s3bQsxMfVVi-xm4xVR7ikk",
  authDomain: "hh-book-center.firebaseapp.com",
  projectId: "hh-book-center",
  storageBucket: "hh-book-center.firebasestorage.app",
  messagingSenderId: "786503882036",
  appId: "1:786503882036:web:9e8e212fa919329616c161"
});
const db = getFirestore(app);
const card = document.getElementById('card');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fail(msg){ card.innerHTML = '<div class="err">' + esc(msg) + '</div>'; }

// Force browser download for Cloudinary files
function downloadHref(d){
  const u = d.downloadUrl || d.fileUrl || '';
  if(u.includes('res.cloudinary.com') && u.includes('/upload/') && !u.includes('fl_attachment')){
    return u.replace('/upload/', '/upload/fl_attachment/');
  }
  return u;
}
function iconFor(n){
  const e = (n||'').split('.').pop().toLowerCase();
  if(e==='pdf') return '📕';
  if(['doc','docx'].includes(e)) return '📝';
  if(['xls','xlsx','csv'].includes(e)) return '📊';
  if(['ppt','pptx'].includes(e)) return '📽️';
  if(['zip','rar','7z'].includes(e)) return '🗜️';
  return '📄';
}

try{
  const id = new URLSearchParams(location.search).get('id');
  if(!id || !/^[a-f0-9]{32}$/.test(id)) throw new Error('bad');
  const snap = await getDoc(doc(db,'shares',id));
  if(!snap.exists()) throw new Error('gone');
  const d = snap.data();
  const preview = d.type === 'photo' && d.fileUrl
    ? '<img src="' + esc(d.fileUrl) + '" alt="">'
    : '<div class="icon">' + iconFor(d.fileName) + '</div>';
  card.innerHTML =
    '<div class="preview">' + preview + '</div>' +
    '<h1>' + esc(d.fileName || 'File') + '</h1>' +
    '<p>Tap the button below to download this file.</p>' +
    '<a class="btn" href="' + esc(downloadHref(d)) + '" download rel="noopener noreferrer">⬇️ Download</a>';
}catch(e){
  fail('This link is invalid or has been removed.');
}
</script>
</body>
</html>
